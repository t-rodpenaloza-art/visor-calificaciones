<div class="resultados-container">

  <!-- Encabezado con botón regresar y contador de resultados -->
  <div class="resultados-header">
    <button type="button" class="btn-regresar-resultados" (click)="volverAGrupos()" aria-label="Volver a grupos">
      <span class="material-icons grupo-arrow">chevron_left</span>
    </button>
    <h3 class="header-titulo">Resultado de búsqueda ({{ estudiantes().length }})</h3>
  </div>

  <!-- Lista de estudiantes encontrados - BAMBOO -->
  @if (estudiantes().length > 0) {
    <div class="lista-estudiantes">
      @for (estudiante of estudiantesPaginados; track estudiante) {
        <bmb-container-button [title]="estudiante.nombreCompleto"
          [subtitle]="'[' + estudiante.matricula + ']'" [iconLeft]="'account_circle'" [iconRight]="'chevron_right'"
          [alternative]="true" (onButton)="seleccionarEstudiante(estudiante)">
        </bmb-container-button>
      }
    </div>
  }

  <!-- Paginación - BAMBOO -->
  @if (estudiantes.length > resultadosPorPagina) {
    <div class="paginacion-container">
      <bmb-paginator [totalItems]="estudiantes.length" [itemsPerPage]="resultadosPorPagina" [currentPage]="paginaActual"
        (pageChange)="onPageChange($event)">
      </bmb-paginator>
    </div>
  }

  <!-- Mensaje cuando no hay resultados -->
  @if (busquedaRealizada && estudiantes().length === 0) {
    <div class="sin-resultados">
      <p>No se encontraron resultados</p>
    </div>
  }
</div>
