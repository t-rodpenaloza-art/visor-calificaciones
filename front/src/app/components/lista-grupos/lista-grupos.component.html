<!-- Sección de mis grupos de mentoría -->
<div class="lista-grupos-container">
  <h3 class="titulo-seccion">Mis grupos de mentoría</h3>

  <!-- Uso button para mejor accesibilidad en lugar de div con role -->
  @for (grupo of grupos; track grupo) {
    <button
      type="button"
      class="grupo-card"
      (click)="seleccionarGrupo(grupo)">
      <div class="grupo-info">
        <span class="grupo-nombre">{{ grupo.nombre }}</span>
        <span class="grupo-clave">{{ grupo.clave }}</span>
      </div>
      <span class="grupo-arrow">›</span>
    </button>
  }

  <!-- Mensaje cuando no hay grupos -->
  @if (grupos.length === 0) {
    <div class="sin-grupos">
      No tienes grupos de mentoría asignados
    </div>
  }
</div>
