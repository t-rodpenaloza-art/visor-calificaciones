      <bmb-card-content [padding]="'s'">
        <!-- Contenido expandido (dos paneles) -->
        <div class="contenido-expandido">

          <!-- Panel izquierdo: Formulario de búsqueda -->
          <div class="panel-busqueda">
            <app-buscador-estudiantes [criterios]="criteriosBusqueda" (buscar)="realizarBusqueda($event)"
              (limpiar)="limpiarBusqueda()">
            </app-buscador-estudiantes>
          </div>

          <!-- Panel derecho: Resultados o Grupos -->
          <div class="panel-resultados">

            <!-- Mostrar resultados si hay búsqueda realizada -->
            @if (busquedaRealizada) {
              <app-resultados-busqueda [estudiantes]="alunmosList()" [busquedaRealizada]="busquedaRealizada"
                (estudianteSeleccionado)="abrirEstudiante($event)" (volver)="limpiarBusqueda()">
              </app-resultados-busqueda>
            }

            @if (!busquedaRealizada) {
              <app-list-groups [gruposMentoria]="gruposMentoria"
                [title]="'Mis grupos de mentoría'">
              </app-list-groups>
            }
          </div>
        </div>
