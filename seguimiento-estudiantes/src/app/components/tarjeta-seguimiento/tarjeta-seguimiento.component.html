<div class="tarjeta-seguimiento" [class.expandida]="vistaExpandida">
  
  <!-- ========== VISTA COLAPSADA (Screenshot 3) ========== -->
  <ng-container *ngIf="!vistaExpandida">
    
    <!-- Tarjeta principal usando bmb-card -->
    <bmb-card [borderRadius]="'m'" [margin]="'none'" [type]="'normal'" [boxShadowStyle]="'none'">
      <bmb-card-header [padding]="'s'">
        <div class="header-content">
          <!-- Ícono usando bmb-interactive-icon -->
          <bmb-interactive-icon
            [icon]="'person_search'"
            [appearance]="'mitec_blue'"
            [appearanceContrast]="'default'"
            [title]="''"
            [description]="''">
          </bmb-interactive-icon>
          
          <h2 class="header-titulo">Seguimiento de estudiantes</h2>
          
          <!-- Ícono expandir -->
          <bmb-interactive-icon
            [icon]="'zoom_out_map'"
            [appearance]="'none'"
            [appearanceContrast]="'default'"
            [title]="''"
            [description]="''"
            (buttonClick)="expandirVista()">
          </bmb-interactive-icon>
        </div>
      </bmb-card-header>
      
      <bmb-card-content [padding]="'s'">
        <!-- Botón para abrir el buscador - Container Button -->
        <bmb-container-button 
          [title]="'Realizar búsqueda de estudiante'" 
          [iconLeft]="''" 
          [iconRight]="'chevron_right'" 
          [alternative]="false"
          (onButton)="expandirVista()">
        </bmb-container-button>

        <!-- Título de sección con línea divisora -->
        <div class="seccion-header">
          <h3 class="seccion-titulo">Mis grupos de mentoría</h3>
        </div>

        <!-- Lista de grupos usando Generic Card (bmb-card) -->
        <div class="grupos-lista">
          <bmb-card 
            *ngFor="let grupo of gruposMentoria"
            [borderRadius]="'s'" 
            [margin]="'none'" 
            [type]="'normal'" 
            [boxShadowStyle]="'none'"
            class="grupo-card"
            (click)="abrirGrupo(grupo)">
            <bmb-card-content [padding]="'none'">
              <button type="button" class="grupo-content">
                <span class="grupo-nombre">{{ grupo.nombre }}</span>
                <span class="grupo-codigo">{{ grupo.clave }}</span>
                <span class="material-symbols-outlined grupo-arrow">chevron_right</span>
              </button>
            </bmb-card-content>
          </bmb-card>
        </div>
      </bmb-card-content>
    </bmb-card>
  </ng-container>

  <!-- ========== VISTA EXPANDIDA (Screenshots 1 y 2) ========== -->
  <ng-container *ngIf="vistaExpandida">
    
    <bmb-card [borderRadius]="'m'" [margin]="'none'" [type]="'normal'" [boxShadowStyle]="'none'">
      <!-- Header expandido -->
      <bmb-card-header [padding]="'s'">
        <div class="header-content expandida">
          <!-- Botón regresar -->
          <bmb-interactive-icon
            [icon]="'chevron_left'"
            [appearance]="'mitec_blue'"
            [appearanceContrast]="'default'"
            [layout]="'button'"
            [title]="''"
            [description]="''"
            (buttonClick)="colapsarVista()">
          </bmb-interactive-icon>
          
          <!-- Ícono principal -->
          <bmb-interactive-icon
            [icon]="'person_search'"
            [appearance]="'mitec_blue'"
            [appearanceContrast]="'default'"
            [layout]="'button'"
            [title]="''"
            [description]="''">
          </bmb-interactive-icon>
          
          <!-- Info del header -->
          <div class="header-info">
            <h2 class="header-titulo">Seguimiento de estudiantes</h2>
            <span class="header-subtitulo">Seguimiento de estudiantes</span>
          </div>
          
          <!-- Acciones del header -->
          <div class="header-acciones">
            <bmb-interactive-icon
              [icon]="'sentiment_satisfied'"
              [appearance]="'mitec_blue'"
              [appearanceContrast]="'default'"
              [layout]="'button'"
              [title]="''"
              [description]="''"
              (buttonClick)="onIconClick('feedback')">
            </bmb-interactive-icon>
            
            <bmb-interactive-icon
              [icon]="'info'"
              [appearance]="'mitec_blue'"
              [appearanceContrast]="'default'"
              [layout]="'button'"
              [title]="''"
              [description]="''"
              (buttonClick)="onIconClick('info')">
            </bmb-interactive-icon>
            
            <bmb-interactive-icon
              [icon]="'zoom_in_map'"
              [appearance]="'mitec_blue'"
              [appearanceContrast]="'default'"
              [layout]="'button'"
              [title]="''"
              [description]="''"
              (buttonClick)="colapsarVista()">
            </bmb-interactive-icon>
          </div>
        </div>
      </bmb-card-header>
      
      <bmb-card-content [padding]="'s'">
        <!-- Contenido expandido (dos paneles) -->
        <div class="contenido-expandido">
          
          <!-- Panel izquierdo: Formulario de búsqueda -->
          <div class="panel-busqueda">
            <app-buscador-estudiantes
              [criterios]="criteriosBusqueda"
              (buscar)="realizarBusqueda($event)"
              (limpiar)="limpiarBusqueda()">
            </app-buscador-estudiantes>
          </div>

          <!-- Panel derecho: Resultados o Grupos -->
          <div class="panel-resultados">
            
            <!-- Mostrar resultados si hay búsqueda realizada -->
            <ng-container *ngIf="busquedaRealizada">
              <app-resultados-busqueda
                [estudiantes]="estudiantesEncontrados"
                [busquedaRealizada]="busquedaRealizada"
                (estudianteSeleccionado)="abrirEstudiante($event)"
                (volver)="limpiarBusqueda()">
              </app-resultados-busqueda>
            </ng-container>

            <!-- Mostrar grupos si no hay búsqueda -->
            <ng-container *ngIf="!busquedaRealizada">
              <div class="seccion-header">
                <h3 class="seccion-titulo">Mis grupos de mentoría</h3>
              </div>
              
              <!-- Lista de grupos usando Generic Card -->
              <div class="grupos-lista">
                <bmb-card 
                  *ngFor="let grupo of gruposMentoria"
                  [borderRadius]="'s'" 
                  [margin]="'none'" 
                  [type]="'normal'" 
                  [boxShadowStyle]="'none'"
                  class="grupo-card"
                  (click)="abrirGrupo(grupo)">
                  <bmb-card-content [padding]="'none'">
                    <button type="button" class="grupo-content">
                      <span class="grupo-nombre">{{ grupo.nombre }}</span>
                      <span class="grupo-codigo">{{ grupo.clave }}</span>
                      <span class="material-symbols-outlined grupo-arrow">chevron_right</span>
                    </button>
                  </bmb-card-content>
                </bmb-card>
              </div>
            </ng-container>
          </div>
        </div>
      </bmb-card-content>
    </bmb-card>
  </ng-container>
</div>
