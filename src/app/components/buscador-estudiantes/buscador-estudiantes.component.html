<div class="buscador-container">
  <form [formGroup]="busquedaForm" (ngSubmit)="ejecutarBusqueda()">
    
    <!-- Campo Matrícula -->
    <bmb-input
      inputId="matricula"
      name="matricula"
      label="Matrícula"
      placeholder="Ej: A00835741"
      [control]="getFormControl('matricula')"
      (onChange)="handleInputChange($event)">
    </bmb-input>

    <!-- Campo Nombre(s) -->
    <bmb-input
      inputId="nombres"
      name="nombres"
      label="Nombre(s)"
      placeholder="Ej: Juan Carlos"
      [control]="getFormControl('nombres')"
      (onChange)="handleInputChange($event)">
    </bmb-input>

    <!-- Campo Apellido Paterno -->
    <bmb-input
      inputId="apellidoPaterno"
      name="apellidoPaterno"
      label="Apellido paterno"
      placeholder="Ej: García"
      [control]="getFormControl('apellidoPaterno')"
      (onChange)="handleInputChange($event)">
    </bmb-input>

    <!-- Campo Apellido Materno -->
    <bmb-input
      inputId="apellidoMaterno"
      name="apellidoMaterno"
      label="Apellido materno"
      placeholder="Ej: López"
      [control]="getFormControl('apellidoMaterno')"
      (onChange)="handleInputChange($event)">
    </bmb-input>

    <!-- Botones de acción - BAMBOO -->
    <div class="botones-accion">
      <button 
        bmbButton 
        type="button"
        (click)="limpiarFormulario()">
        Limpiar
      </button>
      <button 
        bmbButton 
        type="submit" 
        appearance="primary">
        Buscar
      </button>
    </div>

  </form>
</div>
